research.title:
  en: "Research Interests"
  ja: "研究の関心"
  zh: "研究兴趣"
research.p1:
  en: "I believe the appeal of theoretical physics lies in its power to depict, through theory, a world that we cannot see directly. Testing by experiment and observation is indispensable, but what excites me most is that theory can predict and understand a world that has not yet been seen."
  ja: "理論物理学の魅力は、直接には見ることのできない世界の姿を、理論を通して描けることだと考えています。実験や観測による検証を欠かすことはできませんが、それらに先立って、まだ見えていない世界を予言し理解できることに、私は研究の面白さを感じています。"
  zh: "我认为，理论物理的魅力在于能够借助理论，描绘出我们无法直接看到的世界。实验和观测的检验固然不可或缺，但在此之前就能预言并理解尚未被看见的世界，正是我在研究中感受到的乐趣所在。"
research.p2:
  en: "For me, the foremost example is the universe itself. The matter and radiation in the universe carry slight unevenness in density and temperature, and spacetime itself fluctuates, with its ripples traveling as gravitational waves. How these fluctuations were born and how they have evolved reflect the state of the early universe and the properties of the matter in it. Through cosmological perturbation theory, which computes their time evolution, I have been tracing the picture of the beginning of the universe."
  ja: "私にとって、その対象の最たるものが宇宙です。宇宙の物質や輻射にはわずかな密度や温度のむらがあり、時空にも重力波として伝わる変動があります。こうした「揺らぎ」の生まれ方や、その後の変化には、当時の宇宙の状態や物質の性質が反映されます。私は、その時間発展を計算する宇宙論的摂動論を通して、宇宙開闢の姿を追ってきました。"
  zh: "对我而言，其中最具代表性的研究对象就是宇宙。宇宙中的物质和辐射在密度与温度上存在微小的不均匀，时空本身也存在以引力波形式传播的扰动。这些“涨落”如何产生、此后又如何演化，反映了当时宇宙的状态和物质的性质。我一直通过计算其时间演化的宇宙学微扰理论，追寻宇宙诞生之初的图景。"

